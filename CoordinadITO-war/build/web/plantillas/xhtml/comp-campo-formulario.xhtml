<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: un campo del formulario de solicitud (parte de components/requests/request-form.tsx).
  Parámetros (ui:param):
      nombre      -> atributo name del campo; también es la clave en la URL (?courseName=...)
      etiqueta    -> texto de la etiqueta
      ejemplo     -> placeholder
      maximo      -> longitud máxima
      multilinea  -> true = <textarea>, false = <input>
  El valor se toma de la URL con #{param[nombre]}: así, al volver desde la
  pantalla de revisión ("Editar datos") los campos aparecen con lo que se escribió.
  Facelets escapa el valor al imprimirlo, por lo que no hay inyección de HTML.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">
    <label class="field" for="request-#{nombre}">
        <span>#{etiqueta}<span class="required-mark"> *</span></span>
        <ui:fragment rendered="#{multilinea}">
            <textarea id="request-#{nombre}" name="#{nombre}" required="required" maxlength="#{maximo}" placeholder="#{ejemplo}" rows="5">#{param[nombre]}</textarea>
            <small class="character-count">#{empty param[nombre] ? 0 : param[nombre].length()} / #{maximo}</small>
        </ui:fragment>
        <ui:fragment rendered="#{not multilinea}">
            <input id="request-#{nombre}" name="#{nombre}" required="required" maxlength="#{maximo}" placeholder="#{ejemplo}" value="#{param[nombre]}"/>
        </ui:fragment>
    </label>
</ui:composition>
