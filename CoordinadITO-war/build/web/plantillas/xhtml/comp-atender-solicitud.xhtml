<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: panel "Atender solicitud" (solo coordinación, solicitudes no cerradas).
  Equivale a ReviewAction en app/dashboard/requests/[requestId]/page.tsx.
  Parámetros (ui:param):
      codigoEstado -> estado actual: received | in-review
  Desde "received" se puede pasar a En revisión o Rechazada;
  desde "in-review", a Finalizada o Rechazada.
  Aún no guarda nada: el botón está deshabilitado hasta que exista el servicio.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">
    <section class="panel review-action-panel">
        <div class="section-heading">
            <div>
                <h2>Atender solicitud</h2>
                <p>Deja constancia del motivo de cada cambio.</p>
            </div>
            <svg class="icono" width="20" height="20" aria-hidden="true"><use href="#i-edit"/></svg>
        </div>
        <form class="form-section" action="#" onsubmit="return false;">
            <label class="field">
                Siguiente estado
                <select>
                    <ui:fragment rendered="#{codigoEstado eq 'received'}">
                        <option value="in-review" selected="selected">En revisión</option>
                        <option value="rejected">Rechazada</option>
                    </ui:fragment>
                    <ui:fragment rendered="#{codigoEstado ne 'received'}">
                        <option value="completed" selected="selected">Finalizada</option>
                        <option value="rejected">Rechazada</option>
                    </ui:fragment>
                </select>
            </label>
            <label class="field">
                #{codigoEstado eq 'received' ? 'Comentario de seguimiento' : 'Motivo de la resolución'} *
                <textarea maxlength="2000" rows="4" placeholder="Explica el motivo. El estudiante podrá consultar este comentario."></textarea>
            </label>
            <p class="helper-text">
                Vista de diseño: registrar el cambio se conectará al servicio en un sprint posterior.
            </p>
            <button type="submit" class="button button-primary" disabled="disabled">
                <svg class="icono" width="16" height="16" aria-hidden="true"><use href="#i-save"/></svg>
                Registrar cambio
            </button>
        </form>
    </section>
</ui:composition>
