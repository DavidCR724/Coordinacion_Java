<?xml version="1.0" encoding="UTF-8"?>
<!--
  VISTA: panel de seguimiento, volumen de solicitudes (solo jefatura). HU 7.1 y 7.4.
  - El periodo se elige con comp-filtro-periodo; al cambiarlo, «tablero» se vuelve a dibujar.
  - Datos: seguimientoControl.volumen (SeguimientoService.volumen): conteo por tipo de trámite y
    estado, por carrera y el total. Las gráficas las arma GraficaBarras en Java.
  - «Exportar historial» (HU 7.4) descarga un CSV del periodo (se abre en Excel) y queda en la auditoría.
-->
<ui:composition template="/plantillas/xhtml/plantilla-panel.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core"
                xmlns:p="primefaces">

    <ui:param name="seccion" value="volumen"/>
    <ui:param name="rotulo" value="Seguimiento"/>

    <ui:define name="titulo">Volumen de solicitudes</ui:define>

    <ui:define name="contenido">
        <c:set var="rol" value="#{sesionControl.rol}"/>

        <ui:fragment rendered="#{rol ne 'head'}">
            <ui:include src="/plantillas/xhtml/comp-estado-vacio.xhtml">
                <ui:param name="icono" value="chart-bar"/>
                <ui:param name="tituloVacio" value="Panel de jefatura"/>
                <ui:param name="descripcion" value="El seguimiento del volumen de solicitudes de todas las carreras corresponde a la jefatura."/>
                <ui:param name="destino" value="/vista/inicio"/>
                <ui:param name="accion" value="Volver al inicio"/>
            </ui:include>
        </ui:fragment>

        <ui:fragment rendered="#{rol eq 'head'}">
            <ui:decorate template="/plantillas/xhtml/comp-encabezado.xhtml">
                <ui:param name="tituloPagina" value="Seguimiento"/>
                <ui:param name="conAccion" value="true"/>
                <ui:define name="accion">
                    <div class="flex align-items-center gap-3 flex-wrap">
                        <ui:include src="/plantillas/xhtml/comp-filtro-periodo.xhtml">
                            <ui:param name="actualizar" value=":tablero"/>
                        </ui:include>
                        <h:form id="formExportar">
                            <p:commandButton id="exportar" value="Exportar historial" icon="pi pi-download" ajax="false"
                                             styleClass="ui-button-outlined">
                                <p:fileDownload value="#{seguimientoControl.exportacion}"/>
                            </p:commandButton>
                        </h:form>
                    </div>
                </ui:define>
            </ui:decorate>
            <ui:include src="/plantillas/xhtml/comp-pestanas-seguimiento.xhtml">
                <ui:param name="actual" value="volumen"/>
            </ui:include>

            <h:panelGroup id="tablero" layout="block">
                <c:set var="vol" value="#{seguimientoControl.volumen}"/>
                <c:set var="t" value="#{vol.total}"/>

                <!-- ===== Métricas ===== -->
                <div class="grid mb-2">
                    <div class="col-12 sm:col-6 xl:col-3">
                        <ui:include src="/plantillas/xhtml/comp-tarjeta-metrica.xhtml">
                            <ui:param name="etiqueta" value="Solicitudes registradas"/>
                            <ui:param name="valor" value="#{t.total}"/>
                            <ui:param name="nota" value="#{seguimientoControl.elegido().etiqueta}"/>
                            <ui:param name="icono" value="file"/>
                        </ui:include>
                    </div>
                    <div class="col-12 sm:col-6 xl:col-3">
                        <ui:include src="/plantillas/xhtml/comp-tarjeta-metrica.xhtml">
                            <ui:param name="etiqueta" value="Abiertas"/>
                            <ui:param name="valor" value="#{t.abiertas}"/>
                            <ui:param name="nota" value="#{t.recibidas} recibidas · #{t.enRevision} en revisión · #{t.enEspera} esperan información"/>
                            <ui:param name="icono" value="clock"/>
                            <ui:param name="tono" value="tono-naranja"/>
                        </ui:include>
                    </div>
                    <div class="col-12 sm:col-6 xl:col-3">
                        <ui:include src="/plantillas/xhtml/comp-tarjeta-metrica.xhtml">
                            <ui:param name="etiqueta" value="Finalizadas"/>
                            <ui:param name="valor" value="#{t.finalizadas}"/>
                            <ui:param name="nota" value="#{seguimientoControl.porcentaje(t.finalizadas)}% del total"/>
                            <ui:param name="icono" value="check"/>
                            <ui:param name="tono" value="tono-verde"/>
                        </ui:include>
                    </div>
                    <div class="col-12 sm:col-6 xl:col-3">
                        <ui:include src="/plantillas/xhtml/comp-tarjeta-metrica.xhtml">
                            <ui:param name="etiqueta" value="Rechazadas"/>
                            <ui:param name="valor" value="#{t.rechazadas}"/>
                            <ui:param name="nota" value="#{seguimientoControl.porcentaje(t.rechazadas)}% del total"/>
                            <ui:param name="icono" value="times"/>
                            <ui:param name="tono" value="tono-marino"/>
                        </ui:include>
                    </div>
                </div>

                <!-- ===== Gráficas ===== -->
                <div class="grid">
                    <div class="col-12 xl:col-7">
                        <p:card styleClass="h-full">
                            <f:facet name="title">Por tipo de trámite y estado</f:facet>
                            <ui:include src="/plantillas/xhtml/comp-grafica-barras.xhtml">
                                <ui:param name="grafica" value="#{seguimientoControl.graficaTramites}"/>
                                <ui:param name="descripcion" value="Solicitudes por tipo de trámite, apiladas por estado"/>
                            </ui:include>
                        </p:card>
                    </div>
                    <div class="col-12 xl:col-5">
                        <p:card styleClass="h-full">
                            <f:facet name="title">Por carrera</f:facet>
                            <ui:include src="/plantillas/xhtml/comp-grafica-barras.xhtml">
                                <ui:param name="grafica" value="#{seguimientoControl.graficaCarreras}"/>
                                <ui:param name="descripcion" value="Solicitudes por carrera"/>
                            </ui:include>
                        </p:card>
                    </div>
                </div>

                <!-- ===== Tabla ===== -->
                <h:form styleClass="mt-3">
                    <p:dataTable id="tablaVolumen" value="#{vol.porTramite}" var="f" reflow="true" styleClass="tabla-volumen"
                                 emptyMessage="No se registraron solicitudes en este periodo.">
                        <p:column headerText="Tipo de trámite">#{f.nombre}</p:column>
                        <p:column headerText="Recibidas" styleClass="text-right">#{f.recibidas}</p:column>
                        <p:column headerText="En revisión" styleClass="text-right">#{f.enRevision}</p:column>
                        <p:column headerText="Requieren información" styleClass="text-right">#{f.enEspera}</p:column>
                        <p:column headerText="Finalizadas" styleClass="text-right">#{f.finalizadas}</p:column>
                        <p:column headerText="Rechazadas" styleClass="text-right">#{f.rechazadas}</p:column>
                        <p:column headerText="Total" styleClass="text-right font-bold">#{f.total}</p:column>
                        <p:columnGroup type="footer">
                            <p:row>
                                <p:column footerText="Total del periodo" style="text-align: left;"/>
                                <p:column footerText="#{t.recibidas}" styleClass="text-right"/>
                                <p:column footerText="#{t.enRevision}" styleClass="text-right"/>
                                <p:column footerText="#{t.enEspera}" styleClass="text-right"/>
                                <p:column footerText="#{t.finalizadas}" styleClass="text-right"/>
                                <p:column footerText="#{t.rechazadas}" styleClass="text-right"/>
                                <p:column footerText="#{t.total}" styleClass="text-right"/>
                            </p:row>
                        </p:columnGroup>
                    </p:dataTable>
                </h:form>
                <p class="text-color-secondary text-sm mt-3">
                    Cuenta solo las solicitudes registradas en el portal en el periodo elegido.
                </p>
            </h:panelGroup>
        </ui:fragment>
    </ui:define>
</ui:composition>
