<?xml version="1.0" encoding="UTF-8"?>
<!--
  VISTA: perfil. Equivale a app/dashboard/profile/page.tsx.
  Solo lectura: los datos salen de la cuenta en sesión (#{sesionControl.usuario}).
    - Nombre y correo vienen de la cuenta institucional.
    - Carrera y semestre del estudiante vienen del padrón (HU 8.1), de su primer acceso
      (autodeclarados, HU 6.4) o de una corrección de coordinación (validados, HU 6.5);
      la insignia «origen» lo dice. Si hay un error, lo corrige coordinación, no el alumno.
    - El rol lo asignan la coordinación de la carrera o jefatura (HU 6.3).
-->
<ui:composition template="/plantillas/xhtml/plantilla-panel.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core"
                xmlns:p="primefaces">

    <ui:param name="seccion" value="perfil"/>
    <ui:param name="rotulo" value="Mi perfil"/>

    <ui:define name="titulo">Mi perfil</ui:define>

    <ui:define name="contenido">
        <c:set var="rol" value="#{sesionControl.rol}"/>
        <c:set var="u" value="#{sesionControl.usuario}"/>

        <ui:include src="/plantillas/xhtml/comp-encabezado.xhtml">
            <ui:param name="tituloPagina" value="Mi perfil"/>
            <ui:param name="descripcion" value="Tu información personal y académica, en un solo lugar."/>
        </ui:include>

        <div class="grid">
            <!-- Tarjeta de identidad -->
            <div class="col-12 xl:col-4">
                <p:card styleClass="text-center">
                    <p:avatar label="#{u.iniciales}" size="xlarge" shape="circle" styleClass="app-avatar mb-3"/>
                    <div><p:tag value="#{u.etiquetaRol}" rounded="true"/></div>
                    <h2 class="text-xl mb-1">#{u.nombreCompleto}</h2>
                    <p class="text-color-secondary mt-0">#{u.correo}</p>
                    <p:divider/>
                    <i class="pi pi-graduation-cap text-2xl text-color-secondary" aria-hidden="true"></i>
                    <p class="mb-1">#{u.carrera}</p>
                    <ui:fragment rendered="#{rol eq 'student'}"><strong>#{u.control}</strong></ui:fragment>
                    <p:staticMessage severity="info" icon="pi pi-shield" styleClass="mt-4 text-left w-full"
                                     detail="El correo, el número de control y el rol no se cambian desde el perfil."/>
                </p:card>
            </div>

            <!-- Formulario -->
            <div class="col-12 xl:col-8">
                <p:card>
                    <f:facet name="title">
                        <div class="flex justify-content-between align-items-center flex-wrap gap-2">
                            Información personal
                            <p:chip label="Mi expediente" icon="pi pi-user"/>
                        </div>
                    </f:facet>
                    <f:facet name="subtitle">Revisa tus datos antes de registrar una solicitud. Se toman de tu cuenta y del registro institucional.</f:facet>

                    <div class="formgrid grid">
                        <div class="field col-12 md:col-6">
                            <p:outputLabel for="nombres" value="Nombre(s)" styleClass="block font-medium mb-2"/>
                            <p:inputText id="nombres" value="#{u.nombres}" readonly="true" styleClass="w-full"/>
                        </div>
                        <div class="field col-12 md:col-6">
                            <p:outputLabel for="apellidos" value="Apellidos" styleClass="block font-medium mb-2"/>
                            <p:inputText id="apellidos" value="#{u.paterno} #{u.materno}" readonly="true" styleClass="w-full"/>
                        </div>
                        <div class="field col-12 md:col-6">
                            <p:outputLabel for="correo" value="Correo institucional" styleClass="block font-medium mb-2"/>
                            <p:inputText id="correo" value="#{u.correo}" readonly="true" styleClass="w-full"/>
                            <small class="block mt-1 text-color-secondary">Vinculado a tu cuenta institucional.</small>
                        </div>
                        <div class="field col-12 md:col-6">
                            <p:outputLabel for="tipoCuenta" value="Tipo de cuenta" styleClass="block font-medium mb-2"/>
                            <p:inputText id="tipoCuenta" value="#{u.etiquetaRol}" readonly="true" styleClass="w-full"/>
                        </div>
                    </div>

                    <p:divider align="left"><b>Información académica</b></p:divider>

                    <div class="formgrid grid">
                        <div class="field col-12 md:col-6">
                            <p:outputLabel for="carrera" value="#{rol eq 'coordinator' ? 'Carreras que atiendes' : 'Carrera'}" styleClass="block font-medium mb-2"/>
                            <p:inputText id="carrera" value="#{u.carrera}" readonly="true" styleClass="w-full"/>
                        </div>
                        <ui:fragment rendered="#{rol eq 'student'}">
                            <div class="field col-12 md:col-3">
                                <p:outputLabel for="semestre" value="Semestre" styleClass="block font-medium mb-2"/>
                                <p:inputText id="semestre" value="#{u.semestre}.º semestre" readonly="true" styleClass="w-full"/>
                            </div>
                            <div class="field col-12 md:col-3">
                                <p:outputLabel for="control" value="Número de control" styleClass="block font-medium mb-2"/>
                                <p:inputText id="control" value="#{u.control}" readonly="true" styleClass="w-full"/>
                            </div>
                        </ui:fragment>
                    </div>

                    <ui:fragment rendered="#{rol eq 'student'}">
                        <ui:include src="/plantillas/xhtml/comp-aviso.xhtml">
                            <ui:param name="tipo" value="#{u.origen eq 'AUTODECLARADO' ? 'advertencia' : 'exito'}"/>
                            <ui:param name="icono" value="#{u.origen eq 'AUTODECLARADO' ? 'id-card' : 'verified'}"/>
                            <ui:param name="tituloAviso" value="Datos escolares: #{u.origenEtiqueta}"/>
                            <ui:param name="texto" value="#{u.origenExplicacion} Si algo no coincide, acude a la coordinación de tu carrera."/>
                        </ui:include>
                    </ui:fragment>
                </p:card>
            </div>
        </div>
    </ui:define>
</ui:composition>
