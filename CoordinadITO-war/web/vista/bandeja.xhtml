<?xml version="1.0" encoding="UTF-8"?>
<!--
  VISTA: bandeja de atención (solo coordinación). Es su pantalla de entrada: vista/inicio la
  manda aquí (sesionControl.inicioDelRol). HU 2.1, 3.1 y 3.4.
  Bean: bandejaControl (@ViewScoped)
      resumen   -> contadores (nuevas, en revisión, requieren información, prioridad alta)
      filtros   -> buscar y Activas/Finalizadas a la vista; trámite, prioridad, fechas y orden en
                   «Más filtros» (comp-filtros-bandeja); se aplican en la base
      lista     -> SolicitudFila ordenadas por prioridad (mayor primero) y antigüedad (más vieja primero)
  Sin filtro de estado se ven solo las abiertas (Recibida, En revisión, Requiere información).
-->
<ui:composition template="/plantillas/xhtml/plantilla-panel.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core"
                xmlns:p="primefaces">

    <ui:param name="seccion" value="bandeja"/>
    <ui:param name="rotulo" value="Bandeja"/>

    <ui:define name="titulo">Bandeja de atención</ui:define>

    <ui:define name="contenido">
        <c:set var="rol" value="#{sesionControl.rol}"/>

        <ui:fragment rendered="#{rol ne 'coordinator'}">
            <ui:include src="/plantillas/xhtml/comp-estado-vacio.xhtml">
                <ui:param name="icono" value="inbox"/>
                <ui:param name="tituloVacio" value="Espacio de coordinación"/>
                <ui:param name="descripcion" value="La bandeja de atención corresponde a la coordinación de cada carrera."/>
                <ui:param name="destino" value="/vista/inicio"/>
                <ui:param name="accion" value="Volver al inicio"/>
            </ui:include>
        </ui:fragment>

        <ui:fragment rendered="#{rol eq 'coordinator'}">
            <!-- Es la pantalla de entrada de coordinación (vista/inicio la manda aquí). -->
            <ui:include src="/plantillas/xhtml/comp-encabezado.xhtml">
                <ui:param name="tituloPagina" value="Hola, #{sesionControl.usuario.nombres}."/>
            </ui:include>
            <ui:fragment rendered="#{empty sesionControl.usuario.carreras}">
                <p:chip label="Sin carreras asignadas: pide a jefatura que te asigne una" icon="pi pi-exclamation-triangle" styleClass="mb-3"/>
            </ui:fragment>

            <!-- Resumen en una línea: cuatro números (en el teléfono, dos por fila). -->
            <h:panelGroup id="resumenBandeja" layout="block" styleClass="resumen-mini resumen-cuatro">
                <c:set var="r" value="#{bandejaControl.resumen}"/>
                <div class="#{r.nuevas gt 0 ? 'destacado' : ''}"><strong>#{r.nuevas}</strong><span>Por comenzar</span></div>
                <div><strong>#{r.enRevision}</strong><span>En revisión</span></div>
                <div><strong>#{r.requierenInformacion}</strong><span>Esperan al alumno</span></div>
                <div><strong>#{r.prioridadAlta}</strong><span>Prioridad alta o crítica</span></div>
            </h:panelGroup>

            <ui:include src="/plantillas/xhtml/comp-filtros-bandeja.xhtml"/>

            <h:panelGroup id="tablaBandeja" layout="block">
                <ui:include src="/plantillas/xhtml/comp-tabla-solicitudes.xhtml">
                    <ui:param name="solicitudes" value="#{bandejaControl.lista}"/>
                    <ui:param name="conEstudiante" value="true"/>
                    <ui:param name="conPrioridad" value="true"/>
                    <ui:param name="conFiltros" value="false"/>
                    <ui:param name="tarjetasEnMovil" value="true"/>
                </ui:include>
                <ui:fragment rendered="#{bandejaControl.recortada}">
                    <p class="text-color-secondary text-sm mt-2">
                        Se muestran #{bandejaControl.lista.size()} de #{bandejaControl.total}. Usa los filtros para acotar.
                    </p>
                </ui:fragment>
            </h:panelGroup>
        </ui:fragment>
    </ui:define>
</ui:composition>
