<?xml version="1.0" encoding="UTF-8"?>
<!--
  VISTA: bandeja de atención (solo coordinación). Equivale a app/dashboard/review/page.tsx.
  Muestra las solicitudes de la carrera de la coordinadora (ISC): 1043, 1042 y 1031,
  filtrando #{solicitudesDemo} por carrera. La tabla (p:dataTable) busca, filtra y ordena.
-->
<ui:composition template="/plantillas/xhtml/plantilla-panel.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core"
                xmlns:p="primefaces">

    <ui:define name="metadatos">
        <f:metadata>
            <f:viewParam name="rol" value="#{viewScope.rol}"/>
        </f:metadata>
    </ui:define>

    <ui:param name="seccion" value="bandeja"/>
    <ui:param name="rotulo" value="Bandeja de atención"/>

    <ui:define name="titulo">Bandeja de atención</ui:define>

    <ui:define name="contenido">
        <c:set var="rol" value="#{viewScope.rol eq 'coordinator' or viewScope.rol eq 'head' or viewScope.rol eq 'administrator' ? viewScope.rol : 'student'}"/>

        <ui:fragment rendered="#{rol ne 'coordinator'}">
            <ui:include src="/plantillas/xhtml/comp-estado-vacio.xhtml">
                <ui:param name="icono" value="inbox"/>
                <ui:param name="tituloVacio" value="Espacio de coordinación"/>
                <ui:param name="descripcion" value="La bandeja de atención corresponde a la coordinación de cada carrera."/>
                <ui:param name="destino" value="/vista/inicio"/>
                <ui:param name="accion" value="Volver al inicio"/>
            </ui:include>
        </ui:fragment>

        <ui:fragment rendered="#{rol eq 'coordinator'}">
            <ui:include src="/plantillas/xhtml/comp-encabezado.xhtml">
                <ui:param name="eyebrow" value="ATENCIÓN Y SEGUIMIENTO"/>
                <ui:param name="tituloPagina" value="Bandeja de atención"/>
                <ui:param name="descripcion" value="Todas las solicitudes de tu carrera, con un historial claro para cada caso."/>
            </ui:include>

            <div class="mb-3">
                <p:chip label="#{usuariosDemo.coordinator.carrera} · Carrera asignada" icon="pi pi-graduation-cap"/>
            </div>

            <ui:include src="/plantillas/xhtml/comp-tabla-solicitudes.xhtml">
                <ui:param name="solicitudes" value="#{solicitudesDemo.stream().filter(s -> s.carrera eq usuariosDemo.coordinator.carrera).toList()}"/>
                <ui:param name="conEstudiante" value="true"/>
                <ui:param name="conFiltros" value="true"/>
            </ui:include>

            <p class="text-color-secondary mt-3">
                Abre una solicitud para registrar su revisión, emitir una resolución y consultar la
                constancia de cada cambio.
            </p>
        </ui:fragment>
    </ui:define>
</ui:composition>
