<?xml version="1.0" encoding="UTF-8"?>
<!--
  VISTA: detalle de una solicitud. Equivale a app/dashboard/requests/[requestId]/page.tsx.
  Parámetros de la URL: ?folio=1042 | 1031 | 1043  y  ?rol=...
  La solicitud se busca por folio en #{solicitudesDemo} (datos-demo.xhtml), así que la
  pantalla se escribe una sola vez para todas: datos capturados con ui:repeat, historial con
  p:chronoline y el panel de atención con comp-atender-solicitud.
  Quién puede ver qué (igual que visibleRequests() del front):
      student     -> 1042 y 1031 (son suyas)
      coordinator -> 1042, 1031 y 1043 (carrera ISC)
      head        -> todas, solo consulta (sin panel de atención)
      cualquier otro caso (folio inexistente, administrador) -> "Solicitud no disponible"
-->
<ui:composition template="/plantillas/xhtml/plantilla-panel.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core"
                xmlns:p="primefaces">

    <ui:define name="metadatos">
        <f:metadata>
            <f:viewParam name="rol" value="#{viewScope.rol}"/>
            <f:viewParam name="folio" value="#{viewScope.folio}"/>
        </f:metadata>
    </ui:define>

    <ui:param name="seccion" value="#{viewScope.rol eq 'coordinator' ? 'bandeja' : 'solicitudes'}"/>
    <ui:param name="rotulo" value="Detalle de solicitud"/>

    <ui:define name="titulo">Detalle de solicitud</ui:define>

    <ui:define name="contenido">
        <c:set var="rol" value="#{viewScope.rol eq 'coordinator' or viewScope.rol eq 'head' or viewScope.rol eq 'administrator' ? viewScope.rol : 'student'}"/>
        <c:set var="sol" value="#{solicitudesDemo.stream().filter(s -> s.folio eq viewScope.folio).findFirst().orElse(null)}"/>
        <c:set var="visible" value="#{not empty sol and ((rol eq 'student' and sol.control eq usuariosDemo.student.control)
                                                        or (rol eq 'coordinator' and sol.carrera eq usuariosDemo.coordinator.carrera)
                                                        or rol eq 'head')}"/>
        <c:set var="cerrada" value="#{sol.codigoEstado eq 'completed' or sol.codigoEstado eq 'rejected'}"/>

        <!-- ===== Sin acceso o inexistente ===== -->
        <ui:fragment rendered="#{not visible}">
            <ui:include src="/plantillas/xhtml/comp-estado-vacio.xhtml">
                <ui:param name="icono" value="shield"/>
                <ui:param name="tituloVacio" value="Solicitud no disponible"/>
                <ui:param name="descripcion" value="No encontramos esta solicitud entre las que corresponden a tu cuenta o a tu carrera."/>
                <ui:param name="destino" value="/vista/inicio"/>
                <ui:param name="accion" value="Volver al inicio"/>
            </ui:include>
        </ui:fragment>

        <ui:fragment rendered="#{visible}">
            <p:linkButton outcome="#{rol eq 'coordinator' ? '/vista/bandeja' : '/vista/solicitudes'}" includeViewParams="true"
                          value="Volver a solicitudes" icon="pi pi-arrow-left" styleClass="ui-button-flat mb-3 -ml-3"/>

            <ui:decorate template="/plantillas/xhtml/comp-encabezado.xhtml">
                <ui:param name="eyebrow" value="ITO-#{sol.folio}"/>
                <ui:param name="tituloPagina" value="#{sol.tramite}"/>
                <ui:param name="descripcion" value="Registrada el #{sol.registroCompleto}"/>
                <ui:param name="conAccion" value="true"/>
                <ui:define name="accion">
                    <ui:include src="/plantillas/xhtml/comp-insignia-estado.xhtml">
                        <ui:param name="codigoEstado" value="#{sol.codigoEstado}"/>
                    </ui:include>
                    <!-- Solo el estudiante (sus dos solicitudes tienen novedades sin leer). Aún no hace nada. -->
                    <ui:fragment rendered="#{rol eq 'student'}">
                        <p:commandButton type="button" value="Marcar actualizaciones como leídas" icon="pi pi-check"
                                         styleClass="ui-button-flat"/>
                    </ui:fragment>
                </ui:define>
            </ui:decorate>

            <div class="grid">
                <div class="col-12 lg:col-8">
                    <!-- Resolución: solo existe en una solicitud ya finalizada (1031). -->
                    <ui:fragment rendered="#{not empty sol.resolucion}">
                        <p:card styleClass="mb-4 border-green-200">
                            <div class="flex gap-3 align-items-start">
                                <span class="icono-circulo tono-verde"><i class="pi pi-check" aria-hidden="true"></i></span>
                                <div>
                                    <p class="eyebrow">RESOLUCIÓN DE LA SOLICITUD</p>
                                    <h2 class="text-xl my-2">Tu solicitud fue finalizada</h2>
                                    <p class="mt-0">#{sol.resolucion}</p>
                                    <small class="text-color-secondary">#{sol.fechaResolucion}</small>
                                </div>
                            </div>
                        </p:card>
                    </ui:fragment>

                    <p:card styleClass="mb-4">
                        <f:facet name="title">
                            <div class="flex justify-content-between align-items-center">
                                Datos de la solicitud
                                <i class="pi pi-file text-color-secondary" aria-hidden="true"></i>
                            </div>
                        </f:facet>
                        <div class="grid">
                            <ui:include src="/plantillas/xhtml/comp-dato-revision.xhtml">
                                <ui:param name="etiqueta" value="Solicitante"/>
                                <ui:param name="valor" value="#{sol.estudiante}"/>
                            </ui:include>
                            <ui:include src="/plantillas/xhtml/comp-dato-revision.xhtml">
                                <ui:param name="etiqueta" value="Número de control"/>
                                <ui:param name="valor" value="#{sol.control}"/>
                            </ui:include>
                            <ui:include src="/plantillas/xhtml/comp-dato-revision.xhtml">
                                <ui:param name="etiqueta" value="Carrera"/>
                                <ui:param name="valor" value="#{sol.carrera}"/>
                                <ui:param name="completo" value="true"/>
                            </ui:include>
                        </div>
                        <p:divider/>
                        <div class="grid">
                            <ui:repeat value="#{sol.datos}" var="dato">
                                <ui:include src="/plantillas/xhtml/comp-dato-revision.xhtml">
                                    <ui:param name="etiqueta" value="#{dato.etiqueta}"/>
                                    <ui:param name="valor" value="#{dato.valor}"/>
                                    <ui:param name="completo" value="#{dato.etiqueta.startsWith('Motivo')}"/>
                                </ui:include>
                            </ui:repeat>
                        </div>
                    </p:card>

                    <!-- Panel de atención: solo coordinación y solo si la solicitud no está cerrada. -->
                    <ui:fragment rendered="#{rol eq 'coordinator' and not cerrada}">
                        <ui:include src="/plantillas/xhtml/comp-atender-solicitud.xhtml">
                            <ui:param name="codigoEstado" value="#{sol.codigoEstado}"/>
                        </ui:include>
                    </ui:fragment>

                    <!-- Solicitud cerrada: solo lectura. -->
                    <ui:fragment rendered="#{cerrada}">
                        <p:staticMessage severity="info" icon="pi pi-shield" styleClass="w-full"
                                         detail="Esta solicitud está cerrada. Su resolución e historial se conservan sin cambios. Para otro asunto se requiere una solicitud nueva."/>
                    </ui:fragment>
                </div>

                <div class="col-12 lg:col-4">
                    <p:card>
                        <f:facet name="title">
                            <div class="flex justify-content-between align-items-center">
                                Seguimiento
                                <i class="pi pi-clock text-color-secondary" aria-hidden="true"></i>
                            </div>
                        </f:facet>
                        <!-- De más reciente a más antiguo. -->
                        <ui:include src="/plantillas/xhtml/comp-evento-historial.xhtml">
                            <ui:param name="eventos" value="#{sol.historial}"/>
                        </ui:include>
                        <small class="flex align-items-center gap-2 text-color-secondary">
                            <i class="pi pi-shield" aria-hidden="true"></i> El historial es de solo lectura.
                        </small>
                    </p:card>
                </div>
            </div>
        </ui:fragment>
    </ui:define>
</ui:composition>
