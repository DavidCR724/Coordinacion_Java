<?xml version="1.0" encoding="UTF-8"?>
<!--
  VISTA: historial de notificaciones. HU 5.1 y 5.2.
  Bean: notificacionesControl (@ViewScoped) → NotificacionService.recientes(usuario, 100).
  - De la más reciente a la más antigua; cada una enlaza a la solicitud que la originó.
  - Las no leídas se distinguen (fondo y globo "Nueva"). "Marcar todo como leído" guarda LEIDA_EN.
  - Estudiantes, coordinación y jefatura reciben avisos.
-->
<ui:composition template="/plantillas/xhtml/plantilla-panel.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core"
                xmlns:p="primefaces">

    <ui:define name="metadatos">
        <f:metadata>
        </f:metadata>
    </ui:define>

    <ui:param name="seccion" value="notificaciones"/>
    <ui:param name="rotulo" value="Notificaciones"/>

    <ui:define name="titulo">Notificaciones</ui:define>

    <ui:define name="contenido">
        <c:set var="rol" value="#{sesionControl.rol}"/>

        <ui:fragment rendered="#{true}">
            <ui:include src="/plantillas/xhtml/comp-encabezado.xhtml">
                <ui:param name="tituloPagina" value="Notificaciones"/>
                <ui:param name="descripcion" value="#{rol eq 'student' ? 'Todos los avisos sobre tus solicitudes, aunque ya no tengas el correo.' : 'Solicitudes nuevas y respuestas de alumnos de tus carreras.'}"/>
            </ui:include>

            <!-- Una sola columna: la lista es lo único de esta página. -->
            <div class="columna-lectura">
                <div>
                    <h:form id="formNotificaciones">
                        <p:card>
                            <h:panelGroup id="listaNotificaciones" layout="block">
                                <c:set var="pendientes" value="#{notificacionesControl.pendientes}"/>
                                <div class="flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
                                    <p:selectOneButton value="#{notificacionesControl.filtro}" unselectable="false">
                                        <f:selectItem itemValue="#{null}" itemLabel="Todas (#{notificacionesControl.avisos.size()})"/>
                                        <f:selectItem itemValue="sinLeer" itemLabel="Sin leer (#{pendientes})"/>
                                        <p:ajax update="listaNotificaciones"/>
                                    </p:selectOneButton>
                                    <p:commandButton value="Marcar todo como leído" icon="pi pi-check"
                                                     styleClass="ui-button-flat" disabled="#{pendientes eq 0}"
                                                     action="#{notificacionesControl.marcarTodas}" process="@this"
                                                     update="listaNotificaciones"/>
                                </div>

                                <c:set var="lista" value="#{notificacionesControl.visibles}"/>
                                <ui:repeat value="#{lista}" var="aviso">
                                    <ui:include src="/plantillas/xhtml/comp-fila-notificacion.xhtml"/>
                                </ui:repeat>
                                <ui:fragment rendered="#{empty lista}">
                                    <div class="text-center py-5">
                                        <span class="icono-circulo tono-verde mb-2"><i class="pi pi-check" aria-hidden="true"></i></span>
                                        <p class="font-semibold mb-1">Estás al día</p>
                                        <p class="text-color-secondary m-0">#{empty notificacionesControl.avisos ? 'Todavía no tienes notificaciones.' : 'No tienes notificaciones sin leer.'}</p>
                                    </div>
                                </ui:fragment>
                            </h:panelGroup>
                        </p:card>
                    </h:form>
                </div>

            </div>
        </ui:fragment>
    </ui:define>
</ui:composition>
