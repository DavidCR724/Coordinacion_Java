<?xml version="1.0" encoding="UTF-8"?>
<!--
  VISTA: periodos de atención (solo administración). Equivale a app/dashboard/periods/page.tsx.
  Un formulario (p:card) por trámite del catálogo #{tramitesDemo}: componente comp-periodo.xhtml.
  Disponibilidad al 5 nov 2026. Guardar está deshabilitado hasta que exista un bean.
-->
<ui:composition template="/plantillas/xhtml/plantilla-panel.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core">

    <ui:define name="metadatos">
        <f:metadata>
            <f:viewParam name="rol" value="#{viewScope.rol}"/>
        </f:metadata>
    </ui:define>

    <ui:param name="seccion" value="periodos"/>
    <ui:param name="rotulo" value="Periodos de atención"/>

    <ui:define name="titulo">Periodos de atención</ui:define>

    <ui:define name="contenido">
        <c:set var="rol" value="#{viewScope.rol eq 'coordinator' or viewScope.rol eq 'head' or viewScope.rol eq 'administrator' ? viewScope.rol : 'student'}"/>

        <ui:fragment rendered="#{rol ne 'administrator'}">
            <ui:include src="/plantillas/xhtml/comp-estado-vacio.xhtml">
                <ui:param name="icono" value="shield"/>
                <ui:param name="tituloVacio" value="Espacio de administración"/>
                <ui:param name="descripcion" value="La configuración de periodos corresponde a administración."/>
                <ui:param name="destino" value="/vista/inicio"/>
                <ui:param name="accion" value="Volver al inicio"/>
            </ui:include>
        </ui:fragment>

        <ui:fragment rendered="#{rol eq 'administrator'}">
            <ui:include src="/plantillas/xhtml/comp-encabezado.xhtml">
                <ui:param name="eyebrow" value="CALENDARIO DE ATENCIÓN"/>
                <ui:param name="tituloPagina" value="Periodos de trámites"/>
                <ui:param name="descripcion" value="Define cuándo se pueden registrar solicitudes para cada trámite."/>
            </ui:include>

            <ui:repeat value="#{tramitesDemo}" var="t">
                <ui:include src="/plantillas/xhtml/comp-periodo.xhtml"/>
            </ui:repeat>
        </ui:fragment>
    </ui:define>
</ui:composition>
