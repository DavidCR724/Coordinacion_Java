<?xml version="1.0" encoding="UTF-8"?>
<!--
  VISTA: lista de solicitudes. Equivale a app/dashboard/requests/page.tsx.
  Bean: solicitudesControl (@ViewScoped). Qué ve cada rol:
      student       -> sus solicitudes (SolicitudService.misSolicitudes), botón "Nueva solicitud"
      coordinator   -> todas las de sus carreras, abiertas y cerradas (SolicitudService.bandeja)
      head          -> todas las de todas las carreras (solo consulta)
  Estudiante: comp-mis-solicitudes (la misma sección de su inicio). Coordinación y jefatura: p:dataTable (comp-tabla-solicitudes).
  Todos eligen entre «Activas» y «Finalizadas» (solicitudesControl.listado, ListaSolicitudes).
-->
<ui:composition template="/plantillas/xhtml/plantilla-panel.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core"
                xmlns:p="primefaces">

    <ui:define name="metadatos">
        <f:metadata>
            <!-- ?ver=finalizadas abre directo el historial (atajo desde el inicio del estudiante). -->
            <f:viewParam name="ver" value="#{solicitudesControl.listado.vista}"/>
        </f:metadata>
    </ui:define>

    <ui:param name="seccion" value="solicitudes"/>
    <ui:param name="rotulo" value="Solicitudes"/>

    <ui:define name="titulo">Solicitudes</ui:define>

    <ui:define name="contenido">
        <c:set var="rol" value="#{sesionControl.rol}"/>

        <!-- Estudiante: la misma sección que ve en su inicio (comp-mis-solicitudes). -->
        <ui:fragment rendered="#{rol eq 'student'}">
            <div class="columna-lectura">
                <ui:include src="/plantillas/xhtml/comp-mis-solicitudes.xhtml">
                    <ui:param name="principal" value="true"/>
                </ui:include>
            </div>
        </ui:fragment>

        <ui:fragment rendered="#{rol ne 'student'}">
            <ui:decorate template="/plantillas/xhtml/comp-encabezado.xhtml">
                <ui:param name="tituloPagina" value="#{rol eq 'head' ? 'Solicitudes de todas las carreras' : 'Solicitudes de mi carrera'}"/>
                <ui:param name="descripcion" value="Consulta el estado, los comentarios y la resolución de cada trámite."/>
            </ui:decorate>
        </ui:fragment>

        <!-- Coordinación y jefatura (jefatura solo consulta) -->
        <ui:fragment rendered="#{rol eq 'coordinator' or rol eq 'head'}">
            <ui:include src="/plantillas/xhtml/comp-tabla-solicitudes.xhtml">
                <ui:param name="listado" value="#{solicitudesControl.listado}"/>
                <ui:param name="conPrioridad" value="true"/>
                <ui:param name="conEstudiante" value="true"/>
                <ui:param name="conFiltros" value="true"/>
            </ui:include>
        </ui:fragment>

        <ui:fragment rendered="#{solicitudesControl.recortada}">
            <p class="text-color-secondary text-sm mt-2">
                Se muestran las #{solicitudesControl.lista.size()} más recientes de #{solicitudesControl.total}.
            </p>
        </ui:fragment>

    </ui:define>
</ui:composition>
