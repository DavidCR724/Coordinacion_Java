<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: insignia de estado de una solicitud (equivale a components/ui/status-badge.tsx).
  Parámetro (ui:param):
      codigoEstado -> received | in-review | completed | rejected
  El color sale de la clase CSS status-<codigoEstado>.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">
    <span class="status-badge status-#{codigoEstado}"><span></span>#{codigoEstado eq 'received' ? 'Recibida' : (codigoEstado eq 'in-review' ? 'En revisión' : (codigoEstado eq 'completed' ? 'Finalizada' : 'Rechazada'))}</span>
</ui:composition>
