<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: panel "Atender solicitud" (solo coordinación, solicitudes abiertas). HU 2.4, 2.5 y 2.7.
  Un solo formulario para todo lo que hace quien atiende: avanzar, finalizar, rechazar o pedir
  información al alumno (antes eran dos tarjetas distintas).
  Bean: detalleSolicitudControl
      acciones          -> estados permitidos desde el actual + "waiting" (pedir información) si no espera ya
      siguienteEstado   -> la elegida; viene marcada la primera (avanzar), que es la más común
      constancia        -> comentario. Opcional al revisar o finalizar (si se hizo lo que pidió el
                           alumno, el estado lo dice todo); obligatorio al rechazar y al pedir información
      textoObligatorio  -> cambia la etiqueta y el texto de ayuda
      registrarCambio() -> SolicitudService.cambiarEstado(...) o solicitarInformacion(...)
  Operación más común (finalizar lo que ya está en revisión): 1 clic en «Registrar».
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <p:card styleClass="mb-4">
        <f:facet name="title">
            <div class="flex justify-content-between align-items-center">
                Atender solicitud
                <i class="pi pi-pencil text-color-secondary" aria-hidden="true"></i>
            </div>
        </f:facet>

        <h:form id="formAtender">
            <div class="field">
                <p:outputLabel for="siguienteEstado" value="¿Qué quieres hacer?" styleClass="block font-medium mb-2"/>
                <p:selectOneButton id="siguienteEstado" value="#{detalleSolicitudControl.siguienteEstado}"
                                   styleClass="acciones-atender">
                    <f:selectItems value="#{detalleSolicitudControl.acciones}" var="codigo" itemValue="#{codigo}"
                                   itemLabel="#{codigo eq 'in-review' ? 'Pasar a revisión' : (codigo eq 'completed' ? 'Finalizar' : (codigo eq 'rejected' ? 'Rechazar' : 'Pedir información'))}"/>
                    <p:ajax update="motivoEtiqueta motivo botonAtender" process="@this"/>
                </p:selectOneButton>
            </div>
            <div class="field">
                <p:outputLabel id="motivoEtiqueta" for="motivo" styleClass="block font-medium mb-2"
                               value="#{detalleSolicitudControl.siguienteEstado eq 'waiting' ? '¿Qué necesitas que envíe o aclare?' : (detalleSolicitudControl.siguienteEstado eq 'rejected' ? 'Motivo del rechazo' : 'Comentario para el alumno (opcional)')}"/>
                <p:inputTextarea id="motivo" value="#{detalleSolicitudControl.constancia}" rows="3" maxlength="2000"
                                 styleClass="w-full"
                                 placeholder="#{detalleSolicitudControl.textoObligatorio ? 'El alumno leerá este texto.' : 'Puedes dejarlo vacío si se hizo lo que pidió.'}"/>
            </div>
            <p:commandButton id="botonAtender" icon="pi #{detalleSolicitudControl.siguienteEstado eq 'waiting' ? 'pi-send' : 'pi-check'}"
                             value="#{detalleSolicitudControl.siguienteEstado eq 'waiting' ? 'Enviar petición' : 'Registrar'}"
                             styleClass="#{detalleSolicitudControl.siguienteEstado eq 'rejected' ? 'ui-button-danger' : ''}"
                             action="#{detalleSolicitudControl.registrarCambio}" process="@form" update=":detalle"/>
        </h:form>
    </p:card>
</ui:composition>
