<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: panel "Atender solicitud" (solo coordinación, solicitudes no cerradas).
  Equivale a ReviewAction en app/dashboard/requests/[requestId]/page.tsx.
  Parámetros (ui:param):
      codigoEstado -> estado actual: received | in-review
  Desde "received" se puede pasar a En revisión o Rechazada;
  desde "in-review", a Finalizada o Rechazada.
  Aún no guarda nada: el botón está deshabilitado hasta que exista el servicio.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <p:card styleClass="mb-4">
        <f:facet name="title">
            <div class="flex justify-content-between align-items-center">
                Atender solicitud
                <i class="pi pi-pencil text-color-secondary" aria-hidden="true"></i>
            </div>
        </f:facet>
        <f:facet name="subtitle">Deja constancia del motivo de cada cambio.</f:facet>

        <h:form>
            <div class="field">
                <p:outputLabel for="siguienteEstado" value="Siguiente estado" styleClass="block font-medium mb-2"/>
                <p:selectOneMenu id="siguienteEstado" value="#{viewScope.siguienteEstado}" styleClass="w-full md:w-20rem">
                    <!-- Solo las transiciones permitidas desde el estado actual (la primera queda elegida). -->
                    <f:selectItems var="opcion" itemValue="#{opcion.valor}" itemLabel="#{opcion.texto}"
                                   value="#{codigoEstado eq 'received'
                                            ? [{'valor': 'in-review', 'texto': 'En revisión'}, {'valor': 'rejected', 'texto': 'Rechazada'}]
                                            : [{'valor': 'completed', 'texto': 'Finalizada'}, {'valor': 'rejected', 'texto': 'Rechazada'}]}"/>
                </p:selectOneMenu>
            </div>
            <div class="field">
                <p:outputLabel for="motivo" styleClass="block font-medium mb-2"
                               value="#{codigoEstado eq 'received' ? 'Comentario de seguimiento' : 'Motivo de la resolución'}"/>
                <p:inputTextarea id="motivo" value="#{viewScope.motivo}" required="true" rows="4" maxlength="2000"
                                 counter="motivoContador" counterTemplate="{0} caracteres restantes" styleClass="w-full"
                                 placeholder="Explica el motivo. El estudiante podrá consultar este comentario."/>
                <h:outputText id="motivoContador" styleClass="block text-color-secondary text-sm mt-1"/>
            </div>
            <p:staticMessage severity="info" summary="Vista de diseño."
                             detail="Registrar el cambio se conectará al servicio en un sprint posterior."
                             styleClass="w-full mb-3"/>
            <p:commandButton value="Registrar cambio" icon="pi pi-save" disabled="true"/>
        </h:form>
    </p:card>
</ui:composition>
