<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: historial de una solicitud como línea de tiempo (p:chronoline de PrimeFaces).
  Parámetro (ui:param):
      eventos -> lista de eventos, del más reciente al más antiguo. Cada evento tiene:
                 codigoEstado, fecha, actor, comentario, transicion (puede ir vacía)
  El marcador de cada evento es un icono del color de su estado.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <p:chronoline value="#{eventos}" var="evento" styleClass="historial">
        <f:facet name="marker">
            <span class="icono-circulo chico #{evento.codigoEstado eq 'completed' ? 'tono-verde' : (evento.codigoEstado eq 'in-review' ? 'tono-naranja' : (evento.codigoEstado eq 'rejected' ? 'tono-marino' : ''))}">
                <i class="pi #{evento.codigoEstado eq 'received' ? 'pi-inbox' : (evento.codigoEstado eq 'in-review' ? 'pi-clock' : (evento.codigoEstado eq 'completed' ? 'pi-check' : 'pi-times'))}" aria-hidden="true"></i>
            </span>
        </f:facet>
        <div class="pb-4">
            <ui:include src="/plantillas/xhtml/comp-insignia-estado.xhtml">
                <ui:param name="codigoEstado" value="#{evento.codigoEstado}"/>
            </ui:include>
            <small class="block mt-2 text-color-secondary">#{evento.fecha}</small>
            <p class="my-2">#{evento.comentario}</p>
            <strong class="text-sm">#{evento.actor}</strong>
            <small class="block text-color-secondary">#{evento.transicion}</small>
        </div>
    </p:chronoline>
</ui:composition>
