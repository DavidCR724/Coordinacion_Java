<!--
  DATOS DE LA DEMOSTRACIÓN (equivale a lib/demo-data.ts del front en React).
  Todavía no hay base de datos ni beans: los componentes de PrimeFaces (p:dataTable,
  p:dataView, p:chronoline...) necesitan una colección, así que aquí se arman listas y mapas
  con la sintaxis de colecciones de Expression Language:  [a, b]  es una lista,
  {'clave': valor}  es un mapa.
  plantilla-panel incluye este archivo una vez por petición; c:set scope="request" deja cada
  colección en el request para que cualquier vista o componente la lea (#{solicitudesDemo}...).
  Cuando existan los beans, estas expresiones se cambian por #{solicitudBean.lista}, etc.

  Colecciones:
      usuariosDemo      mapa rol -> datos del usuario de prueba (student, coordinator, head, administrator)
      tramitesDemo      catálogo de trámites (disponibilidad al 5 nov 2026), con su prioridad, sus requisitos y
                        los campos de su formulario (como la tabla CAMPO_FORMULARIO del modelo de datos)
      solicitudesDemo   solicitudes con sus datos capturados e historial
      avisosDemo        actualizaciones (notificaciones) del estudiante, más reciente primero
      carrerasDemo      catálogo de carreras (tabla CARRERA)
      gruposDemo        solicitudes de apertura de grupo con sus adhesiones (SOLICITUD colectiva + ADHESION)
      materiasDemo      materias de ISC para pedir apertura de grupo (MATERIA)
      comunicadosDemo   avisos oficiales que publica coordinación (AVISO + AVISO_CARRERA)
      cuentasDemo       cuentas con rol de atención y sus carreras (USUARIO + COORDINACION_CARRERA)
      periodosDemo      periodos escolares para los paneles de seguimiento
      volumenDemo       mapa periodo -> conteo de solicitudes por tipo, estado y carrera
-->
