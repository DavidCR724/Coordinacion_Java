<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: selector del periodo escolar de los paneles de seguimiento (HU 7.1 a 7.3:
  "el periodo de consulta es seleccionable"). Es un h:form con un p:selectOneMenu; al cambiar,
  guarda el periodo en #{viewScope.periodo} y refresca por AJAX la parte de la vista indicada.
  Parámetros (ui:param):
      actualizar -> id (con ":" al inicio) del bloque que se vuelve a dibujar, p. ej. :tablero
  Los periodos salen de #{periodosDemo}; por omisión, el primero (el actual).
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <h:form id="formPeriodo" styleClass="flex align-items-center gap-2">
        <p:outputLabel for="periodo" value="Periodo" styleClass="font-medium"/>
        <p:selectOneMenu id="periodo" value="#{viewScope.periodo}" styleClass="w-12rem">
            <f:selectItems value="#{periodosDemo}" var="per" itemValue="#{per.id}" itemLabel="#{per.etiqueta}"/>
            <p:ajax event="change" update="#{actualizar}"/>
        </p:selectOneMenu>
    </h:form>
</ui:composition>
