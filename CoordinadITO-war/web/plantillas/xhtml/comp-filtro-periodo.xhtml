<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: selector del periodo escolar de los paneles de seguimiento (HU 7.1 a 7.4:
  «el periodo de consulta es seleccionable»). Al cambiar, seguimientoControl olvida lo calculado
  y se vuelve a dibujar por AJAX la parte de la vista indicada.
  Parámetros (ui:param):
      actualizar -> id (con ":" al inicio) del bloque que se vuelve a dibujar, p. ej. :tablero
  Los periodos (Ene–Jun / Ago–Dic) salen de seguimientoControl.periodos; por omisión, el actual.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <h:form id="formPeriodo" styleClass="flex align-items-center gap-2">
        <p:outputLabel for="periodo" value="Periodo" styleClass="font-medium"/>
        <p:selectOneMenu id="periodo" value="#{seguimientoControl.periodo}" styleClass="w-12rem">
            <f:selectItems value="#{seguimientoControl.periodos}" var="per" itemValue="#{per.id}" itemLabel="#{per.etiqueta}"/>
            <p:ajax event="change" listener="#{seguimientoControl.cambiarFiltro}" update="#{actualizar}"/>
        </p:selectOneMenu>
    </h:form>
</ui:composition>
