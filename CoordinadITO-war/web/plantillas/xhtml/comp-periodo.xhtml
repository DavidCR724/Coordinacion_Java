<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: formulario del periodo de atención de un trámite (PeriodForm en periods/page.tsx).
  Parámetros (ui:param):
      codigo      -> siglas (BM, CH...)
      nombre      -> nombre del trámite
      disponible  -> true | false (color de la insignia)
      etiqueta    -> Disponible | Próximamente | Periodo cerrado
      apertura    -> fecha ISO (2026-08-17), para <input type="date">
      cierre      -> fecha ISO
  Aún no guarda nada: el botón está deshabilitado hasta que exista el servicio.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">
    <form class="panel period-form" action="#" onsubmit="return false;">
        <div class="section-heading">
            <div class="period-title">
                <span class="procedure-symbol">#{codigo}</span>
                <div>
                    <h2>#{nombre}</h2>
                    <span class="availability-badge #{disponible ? 'available' : ''}">#{etiqueta}</span>
                </div>
            </div>
            <label class="checkbox-label">
                <input type="checkbox" checked="checked"/>
                Habilitado
            </label>
        </div>
        <div class="form-section">
            <div class="form-grid">
                <label class="field">
                    Fecha de apertura
                    <input type="date" required="required" value="#{apertura}"/>
                </label>
                <label class="field">
                    Fecha de cierre
                    <input type="date" required="required" min="#{apertura}" value="#{cierre}"/>
                </label>
            </div>
            <p class="helper-text">El periodo incluye los días de apertura y cierre.</p>
        </div>
        <div class="form-footer">
            <div aria-live="polite">
                <p class="helper-text">Vista de diseño: guardar el periodo se conectará al servicio en un sprint posterior.</p>
            </div>
            <button class="button button-primary" type="submit" disabled="disabled">
                <svg class="icono" width="16" height="16" aria-hidden="true"><use href="#i-save"/></svg>
                Guardar periodo
            </button>
        </div>
    </form>
</ui:composition>
