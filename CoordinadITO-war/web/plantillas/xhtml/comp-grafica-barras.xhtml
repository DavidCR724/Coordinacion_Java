<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: gráfica de barras (p:chart de PrimeFaces, que dibuja con Chart.js).
  La configuración de Chart.js la arma el control en Java con el builder GraficaBarras
  (control.vista), p. ej. seguimientoControl.graficaTramites; aquí solo se dibuja.
  Parámetros (ui:param):
      grafica     -> configuración de Chart.js en JSON
      alto        -> (opcional) alto de la gráfica en CSS; por omisión 320px
      descripcion -> texto alternativo para lectores de pantalla
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <div class="grafica" style="height: #{empty alto ? '320px' : alto};">
        <p:chart value="#{grafica}" ariaLabel="#{descripcion}" style="height: 100%;"/>
    </div>
</ui:composition>
