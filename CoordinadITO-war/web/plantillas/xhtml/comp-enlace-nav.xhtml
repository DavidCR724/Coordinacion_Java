<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: una opción del menú lateral (un p:menuitem de PrimeFaces).
  Se incluye DENTRO de un <p:tieredMenu> (ver comp-menu-lateral.xhtml).
  Parámetros (ui:param):
      destino  -> outcome de navegación, p. ej. /vista/inicio
      etiqueta -> texto visible
      icono    -> nombre del PrimeIcon sin el prefijo "pi-" (home, user, folder, ...)
      activo   -> true si es la sección actual
      contador -> (opcional) número a mostrar como globo; no se pinta si es 0 o falta
      visible  -> (opcional) false para ocultarla (p. ej. según el rol); por omisión se muestra
  Nota: dentro del menú no se puede usar ui:fragment (el menú solo dibuja hijos que sean
  opciones de menú), por eso el "mostrar u ocultar" va en el atributo rendered.
  includeViewParams="true" conserva ?rol=... al navegar (cada vista lo declara con f:viewParam).
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <p:menuitem value="#{etiqueta}"
                outcome="#{destino}"
                includeViewParams="true"
                icon="pi pi-#{icono}"
                badge="#{not empty contador and contador gt 0 ? contador.toString() : null}"
                containerStyleClass="#{activo ? 'menu-activo' : ''}"
                rendered="#{empty visible or visible}"/>
</ui:composition>
