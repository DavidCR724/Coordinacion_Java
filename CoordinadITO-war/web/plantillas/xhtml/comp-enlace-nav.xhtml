<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: enlace del menú lateral.
  Parámetros (ui:param):
      destino  -> outcome de navegación, p. ej. /vista/inicio
      etiqueta -> texto visible
      icono    -> nombre del icono del sprite (home, user, folder, ...)
      activo   -> true si es la sección actual
      contador -> (opcional) número a mostrar como globo; no se pinta si es 0 o falta
  h:link genera un <a> con la URL correcta (incluye el contexto /CoordinadITO-war).
  f:param agrega ?rol=... para conservar el rol de la demostración al navegar.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:pt="jakarta.faces.passthrough">
    <h:link outcome="#{destino}"
            styleClass="nav-link #{activo ? 'active' : ''}"
            pt:aria-current="#{activo ? 'page' : null}">
        <f:param name="rol" value="#{param.rol}" disable="#{empty param.rol}"/>
        <svg class="icono" width="20" height="20" aria-hidden="true"><use href="#i-#{icono}"/></svg>
        <span class="sidebar-label">#{etiqueta}</span>
        <ui:fragment rendered="#{not empty contador and contador gt 0}">
            <span class="nav-count sidebar-label">#{contador}</span>
        </ui:fragment>
    </h:link>
</ui:composition>
