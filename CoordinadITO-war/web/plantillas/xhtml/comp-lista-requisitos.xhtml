<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: requisitos de un trámite, como lista con palomita (PrimeIcon pi-check).
  Parámetros (ui:param):
      requisitos -> lista de textos (campo "requisitos" de un trámite en datos-demo.xhtml)
  Para mostrar solo algunos, la vista pasa una sublista: #{t.requisitos.subList(0, 2)}.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">
    <ul class="lista-requisitos">
        <ui:repeat value="#{requisitos}" var="requisito">
            <li><i class="pi pi-check-circle" aria-hidden="true"></i><span>#{requisito}</span></li>
        </ui:repeat>
    </ul>
</ui:composition>
