<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: tarjeta de un trámite del catálogo (parte de app/dashboard/procedures/page.tsx).
  Es un p:card. Se usa dentro de <ui:repeat var="t"> sobre #{tramitesDemo}.
  Campos de "t": id, codigo, nombre, descripcion, apertura, cierre, disponible, etiqueta, requisitos.
  El botón lleva a /vista/tramite-detalle?id=...
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <p:card styleClass="h-full flex flex-column #{t.disponible ? '' : 'opacity-80'}">
        <div class="flex justify-content-between align-items-center mb-3">
            <p:avatar label="#{t.codigo}" size="large" styleClass="#{t.disponible ? 'app-avatar' : ''}"/>
            <p:tag value="#{t.etiqueta}" rounded="true"
                   severity="#{t.disponible ? 'success' : (t.id eq 'course-enrollment' ? 'warning' : 'danger')}"/>
        </div>
        <h2 class="text-xl mt-0 mb-2">#{t.nombre}</h2>
        <p class="text-color-secondary mt-0">#{t.descripcion}</p>
        <p class="flex align-items-center gap-2 text-sm">
            <i class="pi pi-calendar" aria-hidden="true"></i> #{t.apertura} — #{t.cierre}
        </p>
        <p:divider/>
        <h3 class="text-sm font-semibold mt-0 mb-2">Antes de solicitarlo</h3>
        <ui:include src="/plantillas/xhtml/comp-lista-requisitos.xhtml">
            <ui:param name="requisitos" value="#{t.requisitos.subList(0, 2)}"/>
        </ui:include>
        <div class="mt-3">
            <p:linkButton outcome="/vista/tramite-detalle" includeViewParams="true" iconPos="right" icon="pi pi-arrow-right"
                          value="#{t.disponible ? 'Iniciar solicitud' : 'Consultar disponibilidad'}"
                          styleClass="w-full #{t.disponible ? '' : 'ui-button-outlined'}">
                <f:param name="id" value="#{t.id}"/>
            </p:linkButton>
        </div>
    </p:card>
</ui:composition>
