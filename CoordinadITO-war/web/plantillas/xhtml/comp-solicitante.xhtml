<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: franja con los datos de quien solicita (nombre, control y carrera) y enlace al perfil.
  Se repite en los dos pasos del formulario de tramite-detalle.xhtml.
  Parámetro (variable de la vista): alumno -> #{usuariosDemo.student}
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <div class="flex align-items-center gap-3 surface-ground border-round p-3">
        <p:avatar icon="pi pi-user" shape="circle"/>
        <div class="flex-1">
            <strong>#{alumno.nombreCompleto}</strong>
            <small class="block text-color-secondary">#{alumno.control} · #{alumno.carrera}</small>
        </div>
        <p:linkButton outcome="/vista/perfil" value="Ver perfil" styleClass="ui-button-flat">
            <f:param name="rol" value="#{viewScope.rol}" disable="#{empty viewScope.rol}"/>
        </p:linkButton>
    </div>
</ui:composition>
