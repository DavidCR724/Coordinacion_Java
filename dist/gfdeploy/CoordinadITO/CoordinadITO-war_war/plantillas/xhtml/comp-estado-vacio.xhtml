<?xml version="1.0" encoding="UTF-8"?>
<!--
  COMPONENTE: estado vacío o acceso no permitido (equivale a components/ui/empty-state.tsx).
  Parámetros (ui:param):
      icono        -> nombre del icono del sprite (por omisión "inbox")
      tituloVacio  -> título
      descripcion  -> texto de apoyo
      destino      -> (opcional) outcome del botón, p. ej. /vista/inicio
      accion       -> (opcional) texto del botón
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">
    <div class="empty-state">
        <span class="empty-icon">
            <svg class="icono" width="27" height="27" aria-hidden="true"><use href="#i-#{empty icono ? 'inbox' : icono}"/></svg>
        </span>
        <h3>#{tituloVacio}</h3>
        <p>#{descripcion}</p>
        <ui:fragment rendered="#{not empty destino and not empty accion}">
            <h:link outcome="#{destino}" styleClass="button button-secondary">
                <f:param name="rol" value="#{param.rol}" disable="#{empty param.rol}"/>
                #{accion}
                <svg class="icono" width="16" height="16" aria-hidden="true"><use href="#i-arrow"/></svg>
            </h:link>
        </ui:fragment>
    </div>
</ui:composition>
