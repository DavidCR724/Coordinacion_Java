<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<!--
  PLANTILLA BASE: el esqueleto HTML que comparten TODAS las páginas.
  Equivale a app/layout.tsx del front en React.
  Las páginas la usan con <ui:composition template="..."> y rellenan los
  huecos <ui:insert> con <ui:define>:
      titulo -> texto de <title>
      cuerpo -> todo lo que va dentro de <body>
-->
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <!-- Tema claro fijo: evita que el navegador oscurezca controles y barras de desplazamiento. -->
        <meta name="color-scheme" content="light"/>
        <title><ui:insert name="titulo">Trámites de Coordinación ITO</ui:insert></title>
        <!-- Tipografía Geist (la del diseño original). Si no hay internet, se usa Arial. -->
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Geist+Mono:wght@100..900&amp;display=swap"/>
        <!-- Recursos JSF: library="css" apunta a la carpeta resources/css. El orden importa. -->
        <h:outputStylesheet library="css" name="reset.css"/>
        <h:outputStylesheet library="css" name="estilos.css"/>
    </h:head>
    <h:body>
        <!-- Sprite de iconos: se define una sola vez y se reutiliza con <use href="#i-..."/>. -->
        <ui:include src="/plantillas/xhtml/iconos.xhtml"/>
        <ui:insert name="cuerpo">Contenido de la página</ui:insert>
    </h:body>
</html>
